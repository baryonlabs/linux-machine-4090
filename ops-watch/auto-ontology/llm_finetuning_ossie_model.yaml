# Apache Ossie (Open Semantic Interchange) Standard Model
# GPU Compute & LLM Fine-Tuning Domain Specification
version: "1.5.0"
name: "gpu-llm-finetuning-ontology"
description: "Semantic layer for multi-tenant LLM fine-tuning, containerized JupyterLab environments, DeepSpeed ZeRO-2 optimization, and NVMe thermal protection on shared RTX 4090 server."

datasets:
  - name: "BaseFoundationModel"
    description: "Pretrained foundation large language model (e.g. LLaMA-3-8B, Qwen-2.5-7B, Mistral-7B)"
    fields:
      - name: "model_id"
        type: "string"
        description: "HuggingFace model identifier (e.g. meta-llama/Meta-Llama-3-8B)"
      - name: "parameter_count_b"
        type: "float"
        description: "Model parameter count in billions"
      - name: "native_context_length"
        type: "integer"
        description: "Native supported context window length in tokens"
      - name: "base_precision"
        type: "string"
        description: "Base weight precision (fp16, bf16, int8)"

  - name: "FineTuningMethod"
    description: "Parameter-Efficient Fine-Tuning (PEFT) and adaptation configuration"
    fields:
      - name: "method_type"
        type: "string"
        description: "Adaptation method (Full-FT, LoRA, QLoRA-4bit, Prefix-Tuning)"
      - name: "lora_rank_r"
        type: "integer"
        description: "Low-Rank Adaptation decomposition rank dimension (e.g. 8, 16, 32)"
      - name: "lora_alpha"
        type: "integer"
        description: "LoRA scaling hyperparameter"
      - name: "target_modules"
        type: "string"
        description: "Target transformer attention/MLP modules (q_proj, v_proj, k_proj, o_proj)"
      - name: "quantization"
        type: "string"
        description: "Base model quantization strategy (none, bitsandbytes-4bit, bitsandbytes-8bit)"

  - name: "TrainingJobRun"
    description: "Fine-tuning job instance running on host NVIDIA RTX 4090"
    fields:
      - name: "job_id"
        type: "string"
        description: "Unique training job run identifier"
      - name: "user"
        type: "string"
        description: "Tenant researcher account name"
      - name: "batch_size"
        type: "integer"
        description: "Per-GPU micro batch size"
      - name: "grad_accum_steps"
        type: "integer"
        description: "Gradient accumulation step count"
      - name: "max_seq_len"
        type: "integer"
        description: "Input sequence length limit in tokens (512, 1024, 2048, 4096)"
      - name: "optimizer"
        type: "string"
        description: "Optimizer variant (adamw_torch, paged_adamw_8bit)"

  - name: "GPUResourceAllocation"
    description: "Physical NVIDIA GeForce RTX 4090 24GB hardware compute telemetry"
    fields:
      - name: "vram_allocated_mb"
        type: "integer"
        description: "Dedicated CUDA VRAM memory consumption in MiB"
      - name: "compute_util_pct"
        type: "integer"
        description: "GPU core compute / tensor active utilization percentage (0-100%)"
      - name: "power_draw_w"
        type: "float"
        description: "Live power dissipation in Watts"
      - name: "gpu_temperature_c"
        type: "integer"
        description: "GPU junction temperature in Celsius"

  - name: "TrainingDataset"
    description: "Curated instruction/tokenized dataset residing under tenant directory /mnt/data/users/<user>"
    fields:
      - name: "dataset_path"
        type: "string"
        description: "Absolute filesystem path to dataset file"
      - name: "total_tokens_m"
        type: "float"
        description: "Estimated token count in millions"
      - name: "dataset_format"
        type: "string"
        description: "File serialization format (jsonl, parquet, arrow, sharegpt)"

  - name: "CheckpointArtifact"
    description: "Produced LoRA adapter weights, optimizer states, and training evaluation metrics"
    fields:
      - name: "checkpoint_dir"
        type: "string"
        description: "Filesystem path to adapter weights (adapter_model.safetensors)"
      - name: "training_loss"
        type: "float"
        description: "Validation cross-entropy loss value"

  - name: "ContainerizedJupyterLab"
    description: "Isolated tenant JupyterLab container runtime with NVIDIA GPU passthrough and shm configuration"
    fields:
      - name: "container_name"
        type: "string"
        description: "Docker container identifier (e.g. martin_jupyter)"
      - name: "port"
        type: "integer"
        description: "Assigned loopback port (8888-8899)"
      - name: "tenant"
        type: "string"
        description: "Assigned researcher username"
      - name: "ipc_mode"
        type: "string"
        description: "IPC namespace sharing mode (host)"
      - name: "shm_size"
        type: "string"
        description: "Shared memory size allocation (16gb)"

  - name: "DeepSpeedZeROPolicy"
    description: "Zero Redundancy Optimizer configuration for offloading optimizer states to host RAM"
    fields:
      - name: "stage"
        type: "integer"
        description: "ZeRO optimization stage (Stage 2)"
      - name: "offload_optimizer_device"
        type: "string"
        description: "Optimizer state target memory (cpu)"
      - name: "allgather_bucket_size"
        type: "integer"
        description: "Allgather communication bucket size in bytes"
      - name: "reduce_bucket_size"
        type: "integer"
        description: "Gradient reduction bucket size in bytes"

  - name: "NVMeThermalTelemetry"
    description: "Live hardware thermal readings from PCIe 4.0 NVMe SSD (/sys/class/hwmon/hwmon1)"
    fields:
      - name: "device"
        type: "string"
        description: "Storage sensor identifier (hwmon1 nvme)"
      - name: "temperature_c"
        type: "float"
        description: "Current SSD junction temperature in Celsius"
      - name: "warning_threshold_c"
        type: "float"
        description: "Safe operating limit threshold (65.0C)"
      - name: "critical_threshold_c"
        type: "float"
        description: "PCIe thermal throttling threshold (75.0C)"

relationships:
  - name: "Job_Executes_Method"
    from: "TrainingJobRun.job_id"
    to: "FineTuningMethod.method_type"
    type: "ManyToOne"
    verbalization: "{TrainingJobRun} applies parameter-efficient strategy {FineTuningMethod}"

  - name: "Job_Tunes_Model"
    from: "TrainingJobRun.job_id"
    to: "BaseFoundationModel.model_id"
    type: "ManyToOne"
    verbalization: "{TrainingJobRun} fine-tunes base architecture {BaseFoundationModel}"

  - name: "Job_Consumes_GPU"
    from: "TrainingJobRun.job_id"
    to: "GPUResourceAllocation.vram_allocated_mb"
    type: "OneToOne"
    verbalization: "{TrainingJobRun} allocates hardware compute resource {GPUResourceAllocation}"

  - name: "Job_Reads_Dataset"
    from: "TrainingJobRun.job_id"
    to: "TrainingDataset.dataset_path"
    type: "ManyToOne"
    verbalization: "{TrainingJobRun} consumes training samples from {TrainingDataset}"

  - name: "Job_Produces_Checkpoint"
    from: "TrainingJobRun.job_id"
    to: "CheckpointArtifact.checkpoint_dir"
    type: "OneToMany"
    verbalization: "{TrainingJobRun} writes persistent checkpoint weights to {CheckpointArtifact}"

  - name: "Job_Runs_In_Container"
    from: "TrainingJobRun.job_id"
    to: "ContainerizedJupyterLab.container_name"
    type: "ManyToOne"
    verbalization: "{TrainingJobRun} executes inside isolated container {ContainerizedJupyterLab}"

  - name: "Container_Governed_By_ZeRO"
    from: "ContainerizedJupyterLab.container_name"
    to: "DeepSpeedZeROPolicy.stage"
    type: "ManyToOne"
    verbalization: "{ContainerizedJupyterLab} memory allocation governed by {DeepSpeedZeROPolicy}"

  - name: "Storage_Guarded_By_Thermal"
    from: "TrainingDataset.dataset_path"
    to: "NVMeThermalTelemetry.temperature_c"
    type: "ManyToOne"
    verbalization: "{TrainingDataset} I/O thermal dissipation guarded by {NVMeThermalTelemetry}"

metrics:
  - name: "VRAM_Efficiency_Ratio"
    description: "VRAM allocation efficiency compared to active compute core utilization"
    expression: "GPUResourceAllocation.compute_util_pct / (GPUResourceAllocation.vram_allocated_mb / 1024.0)"
    unit: "% / GB"
    threshold_policy: "Ratio < 0.5 for > 2 hours triggers Idle_Resource_Warning"

  - name: "Token_Throughput_Per_Sec"
    description: "Effective training token throughput per second"
    expression: "(TrainingJobRun.batch_size * TrainingJobRun.max_seq_len) / Step_Time_Seconds"
    unit: "tokens/sec"

  - name: "NVMe_Thermal_Safety_Margin"
    description: "Operating headroom before PCIe 4.0 thermal throttling occurs"
    expression: "NVMeThermalTelemetry.critical_threshold_c - NVMeThermalTelemetry.temperature_c"
    unit: "deg C"
    threshold_policy: "Headroom < 10.0C triggers NVMe_Cooling_Warning"

  - name: "RTX4090_VRAM_Headroom_GB"
    description: "Remaining physical VRAM headroom on RTX 4090 24GB"
    expression: "24.0 - (GPUResourceAllocation.vram_allocated_mb / 1024.0)"
    unit: "GB"
    threshold_policy: "Headroom < 1.0 GB triggers CUDA_OOM_Risk_Alert"

ai_context:
  guidelines:
    - "RTX 4090 has 24GB VRAM. 8B parameter full fine-tuning is prohibited due to ~48GB requirement; require LoRA (bf16) or QLoRA (4-bit)."
    - "When batch size >= 4 and sequence length > 2048, gradient checkpointing and paged_adamw_8bit must be configured to prevent CUDA OOM."
    - "If a process allocates > 10GB VRAM with 0% compute utilization for > 2 hours, flag as idle compute waste ticket."
