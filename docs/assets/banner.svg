<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Baryon GPU Lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#10b981" stop-opacity=".30"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect width="1280" height="300" fill="url(#glow)"/>
  <rect width="1280" height="300" fill="url(#glow2)"/>

  <rect x="0" y="0" width="1280" height="4" fill="url(#acc)"/>

  <!-- left: title -->
  <text x="72" y="112" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800" fill="#e8eefc" letter-spacing="-1.2">Baryon GPU Lab</text>
  <text x="72" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#93a4c3">Operations, security &amp; observability for a single-GPU research workstation.</text>

  <!-- chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    <rect x="72" y="184" width="118" height="30" rx="15" fill="#0e1a2c" stroke="#3b2f66"/>
    <text x="131" y="204" text-anchor="middle" fill="#c4b5fd">Headscale</text>

    <rect x="200" y="184" width="92" height="30" rx="15" fill="#0e1a2c" stroke="#2a4a6b"/>
    <text x="246" y="204" text-anchor="middle" fill="#7dd3fc">Docker</text>

    <rect x="302" y="184" width="76" height="30" rx="15" fill="#0e1a2c" stroke="#4a3a1b"/>
    <text x="340" y="204" text-anchor="middle" fill="#fcd34d">Falco</text>

    <rect x="388" y="184" width="112" height="30" rx="15" fill="#0e1a2c" stroke="#1d4f43"/>
    <text x="444" y="204" text-anchor="middle" fill="#6ee7b7">Ops-Watch</text>

    <rect x="510" y="184" width="92" height="30" rx="15" fill="#0e1a2c" stroke="#3b2f66"/>
    <text x="556" y="204" text-anchor="middle" fill="#c4b5fd">Discord</text>

    <rect x="612" y="184" width="150" height="30" rx="15" fill="#0e1a2c" stroke="#22304a"/>
    <text x="687" y="204" text-anchor="middle" fill="#c7d4ea">LLM fallback</text>
  </g>

  <text x="72" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">WireGuard 100.64.0.0/10  ·  SSH :2322  ·  Jupyter :8889-8895  ·  No public inbound</text>

  <!-- right: GPU card -->
  <g transform="translate(1010,58)">
    <rect x="0" y="0" width="204" height="184" rx="18" fill="#0b1524" stroke="#1d4f43" stroke-width="1.5"/>
    <rect x="0" y="0" width="204" height="4" rx="2" fill="url(#acc)" opacity=".9"/>

    <rect x="42" y="34" width="120" height="86" rx="10" fill="#0e1a2c" stroke="#2a4a6b" stroke-width="1.5"/>
    <rect x="56" y="48" width="92" height="58" rx="6" fill="none" stroke="#34d399" stroke-opacity=".45"/>
    <text x="102" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#6ee7b7">GPU</text>
    <text x="102" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">24 GB GDDR6X</text>

    <g stroke="#38bdf8" stroke-opacity=".55" stroke-width="2">
      <path d="M62 34V22M78 34V22M94 34V22M110 34V22M126 34V22"/>
      <path d="M62 120V132M78 120V132M94 120V132M110 120V132M126 120V132"/>
      <path d="M42 50H30M42 66H30M42 82H30M42 98H30"/>
      <path d="M162 50H174M162 66H174M162 82H174M162 98H174"/>
    </g>

    <text x="102" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#93a4c3">RTX 4090 · 24 GB</text>
  </g>
</svg>
